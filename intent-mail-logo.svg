<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Intent Mail</title>
  <desc id="desc">A blue gradient envelope with a paper-plane fold above the Intent wordmark.</desc>
  <defs>
    <linearGradient id="env" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08C9F5"/>
      <stop offset=".48" stop-color="#087BFA"/>
      <stop offset="1" stop-color="#0648E8"/>
    </linearGradient>
    <linearGradient id="leftFold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09D2F4"/>
      <stop offset="1" stop-color="#0873F6"/>
    </linearGradient>
    <linearGradient id="rightFold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#087BFA"/>
      <stop offset="1" stop-color="#05BCEB"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25D8F5"/>
      <stop offset=".55" stop-color="#0788F8"/>
      <stop offset="1" stop-color="#064BEA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dy="12" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.02  0 0 0 0 0.25  0 0 0 0 0.68  0 0 0 .18 0" result="shade"/>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Mail mark: editable vector shapes -->
  <g filter="url(#shadow)">
    <rect x="166" y="185" width="692" height="506" rx="86" fill="url(#env)"/>
    <path d="M166 273 Q166 185 254 185 H770 Q835 185 858 238 L540 478 Q512 499 484 478 Z" fill="url(#plane)"/>
    <path d="M166 273 L486 505 Q512 524 540 505 L858 273 V605 Q858 691 772 691 H252 Q166 691 166 605 Z" fill="url(#env)"/>
    <path d="M166 273 L484 505 Q512 526 540 505 L858 273 V605 Q858 691 772 691 H252 Q166 691 166 605 Z" fill="none" opacity=".12" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M166 273 L409 474 L166 654 Z" fill="url(#leftFold)"/>
    <path d="M858 273 L615 474 L858 654 Z" fill="url(#rightFold)"/>
    <path d="M166 273 L484 505 Q512 526 540 505 L858 273" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M552 492 L723 326 L666 302 L858 238 L795 428 L764 370 L620 526 Z" fill="#FFFFFF" opacity=".96"/>
    <path d="M666 302 L858 238 L795 428 L764 370 Z" fill="url(#plane)"/>
    <path d="M723 326 L858 238 L764 370 Z" fill="#064CEB" opacity=".65"/>
  </g>
  <!-- Wordmark only; no separate Intent symbol on the left -->
  <text x="512" y="850" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="126" font-weight="750" letter-spacing="-5" fill="#071D39">intent</text>
</svg>
